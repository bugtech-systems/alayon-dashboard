name: Deploy Medusa Storefront to EC2

on:
  push:
    branches:
      - development  # Triggers deployment on push to development branch
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8  # or your preferred pnpm version

      - name: Install dependencies
        run: pnpm install

      - name: Build storefront
        run: |
          cd apps/web
          pnpm run build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the storefront directory
            cd ~/apps/alayon-dashboard
            
            # Pull latest changes
            git pull origin development
            
            # Install dependencies from root (for monorepo)
            pnpm install
            
            # Navigate to web app directory and build
            cd apps/web
            pnpm run build
            
            # Return to root and restart process with PM2
            cd ~/apps/alayon-dashboard
            
            # Restart the process with PM2 (make sure it's running from apps/web)
            pm2 restart alayon-store || pm2 start "cd apps/web && npm run start" --name "alayon-store"
            
            # Save PM2 process list
            pm2 save
            
            # Optional: Reload Nginx if you're using it
            # sudo systemctl reload nginx
            
            echo "Deployment completed successfully!"