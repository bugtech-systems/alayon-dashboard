name: Deploy Medusa Storefront to EC2

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build storefront
        run: |
          cd apps/web
          pnpm run build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_DEFAULT_REGION: ${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
          NEXT_PUBLIC_N8N: ${{ vars.NEXT_PUBLIC_N8N }}
          NEXT_PUBLIC_N8N_WEBHOOK_BASE: ${{ vars.NEXT_PUBLIC_N8N_WEBHOOK_BASE }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_MEDUSA_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_SECRET_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            
            echo "=== Starting deployment to EC2 ==="
            
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
                \. "$NVM_DIR/nvm.sh"
                nvm use 20 || nvm install 20
            else
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                nvm install 20
                nvm alias default 20
            fi
            
            if ! command -v pnpm &> /dev/null; then
                npm install -g pnpm
            fi
            
            cd ~/apps/alayon-dashboard
            
            git pull origin development
            sudo chown -R $USER:$USER ~/apps/alayon-dashboard
            
            # Use no-frozen-lockfile on EC2 too
            pnpm install --no-frozen-lockfile
            
            cd apps/web
            
            cat > .env.production << EOF
            NODE_ENV=production
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
            NEXT_PUBLIC_N8N=${{ vars.NEXT_PUBLIC_N8N }}
            NEXT_PUBLIC_N8N_WEBHOOK_BASE=${{ vars.NEXT_PUBLIC_N8N_WEBHOOK_BASE }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MEDUSA_SECRET_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_SECRET_KEY }}
            REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
            EOF
            
            npm run build
            
            pm2 restart alayon-store || pm2 start "cd apps/web && npm run start" --name "alayon-store"
            pm2 save
            
            echo "=== Deployment completed! ==="