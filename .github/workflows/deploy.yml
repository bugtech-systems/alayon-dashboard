name: Deploy Medusa Storefront to EC2

on:
  push:
    branches:
      - development  # Triggers deployment on push to main branch
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build storefront
        run: npm run build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the storefront directory
            cd ~/apps/alayon-dashboard
            
            # Pull latest changes
            git pull origin development
            
            # Install dependencies
            npm ci
            
            # Build the application
            npm run build
            
            # Restart the process with PM2
            pm2 restart alayon-store || pm2 start npm --name "alayon-store" -- start
            
            # Save PM2 process list
            pm2 save
            
            # Optional: Reload Nginx if you're using it
            # sudo systemctl reload nginx
            
            echo "Deployment completed successfully!"